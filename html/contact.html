<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お問い合わせ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/css/contact.css">
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<div class="main">
  <form>
    <div class="sub">
      <label>お問い合わせの種類</label>
      <select>
        <option value="チケットについて">チケットについて</option>
        <option value="会場について">会場について</option>
        <option value="出演者について">出演者について</option>
        <option value="その他">その他</option>
      </select>
    </div>

    <div class="sub">
      <label>お名前（必須）</label>
      <input type="text">
    </div>

    <div class="sub">
      <label>お名前（ひらがな）</label>
      <input type="text">
    </div>

    <div class="sub">
      <label>メールアドレス（必須）</label>
      <input type="email">
    </div>

    <div class="sub">
      <label>電話番号（必須）</label>
      <input type="tel">
    </div>

    <div class="sub">
      <label>お問い合わせ内容</label>
      <textarea placeholder="自由にご記入ください。"></textarea>
    </div>

    <div class="button">
      <button type="submit">確認画面へ</button>
    </div>
      <div class="button">
        <a href="#">トップページへ戻る</a>
        </div>
    
  </form>
</div>

</body>
</html>
